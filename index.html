<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.STANDALONE=true;</script>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Business Bug Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow working column; a six-step rail on top; each step is one panel; the last step is a report ticket. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#16211f; --muted:#56655f; --line:#d3dbd8;
  --accent:#0d6a5b; --on-accent:#ffffff;
  --warn:#8f4e00; --warn-soft:#fbeeda; --crit:#a8281f; --good:#256b2c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101615; --surface:#18201e; --ink:#e5ecea; --muted:#9baba6; --line:#2d3a36;
  --accent:#5fcbb5; --on-accent:#06201b;
  --warn:#e9ab55; --warn-soft:#33270f; --crit:#f08b82; --good:#7fcf86; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201e; --ink:#e5ecea; --muted:#9baba6; --line:#2d3a36;
  --accent:#5fcbb5; --on-accent:#06201b;
  --warn:#e9ab55; --warn-soft:#33270f; --crit:#f08b82; --good:#7fcf86; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{font-size:1.6rem;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
h2{font-size:1.25rem;line-height:1.25;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:600}
p{margin:0;max-width:65ch}
.lede{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header{display:flex;flex-direction:column;gap:8px}
.banner{background:var(--warn-soft);border-left:3px solid var(--warn);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner span{min-width:0;flex:1 1 260px}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{flex:1 1 120px;text-align:left;background:transparent;border:0;border-top:3px solid var(--line);padding:8px 4px 4px;color:var(--muted);font:inherit;cursor:pointer}
nav button b{display:block;color:var(--ink);font-weight:600}
nav button small{font-family:var(--mono);font-size:.72rem}
nav button[aria-current="step"]{border-top-color:var(--accent)}
nav button[aria-current="step"] small{color:var(--accent)}
main{background:var(--surface);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>*{min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.row>.field{flex:1 1 170px}
label,.lab{font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px 10px;width:100%;min-width:0;border-radius:3px}
textarea{resize:vertical;min-height:2.6em}
:is(input,select,textarea,button,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.btn{font:inherit;font-weight:500;padding:8px 14px;border-radius:3px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button.ghost{font:inherit;padding:6px 12px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.ghost.danger{color:var(--crit)}
button:disabled{opacity:.55;cursor:default}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.area{margin-top:18px;font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
ol.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.ladder li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
ol.ladder li span{font-family:var(--mono);font-size:.8rem;color:var(--accent);padding-top:3px}
ol.ladder li q{quotes:none;font-weight:500}
ol.ladder li em{display:block;font-style:normal;color:var(--muted);font-size:.85rem}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{cursor:pointer;font-weight:500}
details p{margin-top:6px}
.prow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:start;padding-bottom:8px;border-bottom:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:start}
.check{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.check .ev{grid-column:1/-1}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;color:var(--ink);font-weight:400;border-left:1px solid var(--line)}
.seg label:first-of-type{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+label{background:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg)}
ul.plain li span{flex:1 1 240px;min-width:0}
.prob{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.why{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start}
.why .w-ev{grid-column:2;grid-row:2}
.why .w-rm{grid-column:3;grid-row:1}
.why i{font-style:normal;font-family:var(--mono);color:var(--accent);padding-top:9px}
.hint{font-size:.88rem;color:var(--warn)}
.ok{font-size:.88rem;color:var(--good)}
.note{font-size:.88rem;color:var(--muted)}
.tick{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-weight:400;font-size:.95rem}
.tick input{margin-top:5px}
.out{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.box{background:var(--bg);border-left:3px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.trail{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.trail li b{color:var(--ink);margin-left:8px}
.scroll{overflow-x:auto;max-width:100%}
.m-lane{stroke:var(--line);fill:none}
.m-box{fill:var(--surface);stroke:var(--muted)}
.m-t{fill:var(--ink);font:13px var(--sans)}
.m-l{fill:var(--muted);font:600 12px var(--sans)}
.m-a{stroke:var(--muted);fill:none;stroke-width:1.25}
.m-h{stroke:var(--accent);fill:none;stroke-width:2.5}
.m-ah{fill:var(--muted)}
.m-hh{fill:var(--accent)}
table{border-collapse:collapse;font-size:.88rem;min-width:640px;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
pre.ticket{font-family:var(--mono);font-size:.82rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent);padding:16px;margin:0}
.gaps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media print{nav,#banner,#mode,button,.note,hr{display:none!important}main{border:0;padding:0}}
@media (max-width:560px){
  main{padding:16px}
  ol.ladder li{grid-template-columns:1fr;gap:2px}
  .check{grid-template-columns:1fr}
  .lrow{grid-template-columns:1fr}
}
</style>

</head>

/* ---------- The maths (one place, so every screen and the report agree) ---------- */
function perYear(p){return fl(p.times)*MULT[p.per||'week'];}
function hours(p){return perYear(p)*fl(p.mins)*fl(p.people)/60;}
function size(p){var h=hours(p),tc=(!comp()&&p.cash&&p.cash!=='no')?h*fl(S.rate):0,dr=fl(p.extra),ry=fl(p.riskYears),rk=(!comp()&&ry>0)?fl(p.riskCost)/ry:0,bt=cf(p.confT||p.conf,30),bm=cf(p.confM||p.conf,30),br=cf(p.confR,50),b={lo:tc*(1-bt)+dr*(1-bm)+rk*(1-br),hi:tc*(1+bt)+dr*(1+bm)+rk*(1+br)};
  return {h:h,tc:tc,dr:dr,rk:rk,cash:tc+dr+rk,b:b};}
function optCalc(p,o){var s=size(p),pct=Math.min(fl(o.pct),100)/100,one=fl(o.buy)+fl(o.setup)+fl(o.train),run=fl(o.run),sv=s.cash*pct,net=sv-run,nLo=s.b.lo*pct-run,nHi=s.b.hi*pct-run;
  return {one:one,run:run,sv:sv,net:net,cap:s.h*pct,pay:net>0?one/(net/12):null,best:nHi>0?one/(nHi/12):null,worst:nLo>0?one/(nLo/12):null,three:3*net-one};}
function money(x){return (x<0?'-$':'$')+num(Math.abs(x));}
function range(x,b){return (!x||!b||b.lo===b.hi)?money(x):money(b.lo)+' to '+money(b.hi);}
function mo(x){return x<1?'under 1':num(x);}
function payText(c){if(c.pay==null)return 'Never on cash alone';if(c.one===0)return 'Immediately';
  if(c.worst==null)return 'About '+mo(c.pay)+' months, or never if savings are at the low end';
  return mo(c.best)===mo(c.worst)?'About '+mo(c.pay)+' months':mo(c.best)+' to '+mo(c.worst)+' months';}

function rows(hid,name,fields){var H=holder(hid),list=H[name]||(H[name]=[]);return list.map(function(r,i){return '<div class="prow">'+fields.map(function(f){var at='id="'+name+'-'+hid+'-'+i+'-'+f.k+'" data-h="'+hid+'" data-n="'+name+'" data-i="'+i+'" data-k="'+f.k+'" aria-label="'+esc(f.ph)+'"';

/* ---------- Step 1: Ask ---------- */
function ladderHtml(){var t=(S.topic||'').trim()||'do this task';t=esc(t.replace(/[.?!]+$/,''));
  var L=[['1 Open','Walk me through how you '+t+', start to finish.','Gets you the story. Let them talk.'],['2 Probe','What happens right after that? Who does it?','Ask this about every step they mention.'],['3 Count','How often do you '+t+'? How long does it take each time? How many people touch it?','These numbers are your evidence. Write them down exactly.'],['4 Break it','Tell me about the last time something went wrong when you tried to '+t+'. How was it found?','Real failures tell you more than opinions.'],['5 Confirm','So what I am hearing is ____. Is that right?','Say it back in your own words. They will correct you.']];
  return L.map(function(r){return '<li><span>'+r[0]+'</span><div><q>'+r[1]+'</q><em>'+r[2]+'</em></div></li>';}).join('');}
function handoffs(){var n=0,st=S.steps.filter(function(s){return (s.who||'').trim();});for(var i=1;i<st.length;i++)if(st[i].who.trim().toLowerCase()!==st[i-1].who.trim().toLowerCase())n++;
  return st.length<2?'<span class="note">Add at least two steps to count the handoffs.</span>':'<span class="out">'+n+' handoff'+(n===1?'':'s')+'</span> <span class="note">across '+st.length+' steps. Each handoff is a place where work can wait or get lost, so ask about every one.</span>';}
function wrap2(s,n){var w=String(s||'').trim().split(/\s+/),a='',b='',i=0;for(;i<w.length;i++){if((a+' '+w[i]).trim().length<=n)a=(a+' '+w[i]).trim();else break;}b=w.slice(i).join(' ');if(!a){a=b.slice(0,n);b=b.slice(n);}if(b.length>n)b=b.slice(0,n-1)+'…';return [a,b];}
function mapSvg(){var st=S.steps.filter(function(s){return (s.who||'').trim();});if(st.length<2)return '';
  var lanes=[],key=function(s){return s.who.trim().toLowerCase();};st.forEach(function(s){if(lanes.indexOf(key(s))<0)lanes.push(key(s));});
  var LW=120,CW=160,BW=136,BH=44,LH=68,W=LW+st.length*CW+8,H=lanes.length*LH+2,h='',n=0;
  var cx=function(i){return LW+i*CW+CW/2;},cy=function(i){return 1+lanes.indexOf(key(st[i]))*LH+LH/2;};
  lanes.forEach(function(k,j){var name='';st.forEach(function(s){if(!name&&key(s)===k)name=s.who.trim();});if(name.length>15)name=name.slice(0,14)+'…';
    h+='<rect class="m-lane" x="1" y="'+(1+j*LH)+'" width="'+(W-2)+'" height="'+LH+'"/><text class="m-l" x="10" y="'+(1+j*LH+LH/2+4)+'">'+esc(name)+'</text>';});
  for(var i=1;i<st.length;i++){var same=key(st[i])===key(st[i-1]);if(!same)n++;
    var d=same?'M'+(cx(i-1)+BW/2)+' '+cy(i)+'H'+(cx(i)-BW/2):'M'+(cx(i-1)+BW/2)+' '+cy(i-1)+'H'+cx(i)+'V'+(cy(i)+(cy(i)>cy(i-1)?-BH/2:BH/2));
    h+='<path class="'+(same?'m-a':'m-h')+'" d="'+d+'" marker-end="url(#'+(same?'ma':'mh')+')"/>';}
  st.forEach(function(s,i){var t=wrap2(s.what||'(step)',18);h+='<rect class="m-box" x="'+(cx(i)-BW/2)+'" y="'+(cy(i)-BH/2)+'" width="'+BW+'" height="'+BH+'" rx="6"/>'+(t[1]?'<text class="m-t" text-anchor="middle" x="'+cx(i)+'" y="'+(cy(i)-3)+'">'+esc(t[0])+'</text><text class="m-t" text-anchor="middle" x="'+cx(i)+'" y="'+(cy(i)+13)+'">'+esc(t[1])+'</text>':'<text class="m-t" text-anchor="middle" x="'+cx(i)+'" y="'+(cy(i)+5)+'">'+esc(t[0])+'</text>');});
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Process map: '+st.length+' steps, '+lanes.length+' roles, '+n+' handoffs"><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="m-ah" d="M0 0L10 5L0 10z"/></marker><marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path class="m-hh" d="M0 0L10 5L0 10z"/></marker></defs>'+h+'</svg>';}
function listHtml(l,k1,k2,ph1,ph2){return S[l].map(function(r,i){return '<div class="lrow"><input type="text" id="'+l+'-'+i+'-a" data-l="'+l+'" data-i="'+i+'" data-k="'+k1+'" value="'+esc(r[k1])+'" placeholder="'+ph1+'" aria-label="'+ph1+'"><input type="text" id="'+l+'-'+i+'-b" data-l="'+l+'" data-i="'+i+'" data-k="'+k2+'" value="'+esc(r[k2])+'" placeholder="'+ph2+'" aria-label="'+ph2+'"><button type="button" class="ghost" data-rml="'+l+'" data-i="'+i+'">Remove</button></div>';}).join('');}
function renderAsk(){
  return '<div class="stack"><h2>Understand the business before the problem</h2><p>A fix is only right if it serves what the business is trying to do. Write that down first, then ask how the work really happens. Never mention your solution.</p></div>'+
  '<div class="stack">'+T('process','What process are you investigating?','data-s="process"',S.process,'Example: booking tutoring sessions')+T('goal','What is the business trying to achieve?','data-s="goal"',S.goal,'Example: serve more students without adding staff')+T('limits','What cannot change? (budget, staff, deadlines, systems, outside rules)','data-s="limits"',S.limits,'Example: no new budget this year')+'</div>'+
  '<div class="stack"><h3>Five questions for any task</h3>'+T('topic','Finish this sentence: "Walk me through how you…"','data-s="topic"',S.topic,'Example: book a tutoring session')+'<ol class="ladder" id="ladder">'+ladderHtml()+'</ol></div>'+
  '<div class="stack"><h3>Questions about the business</h3><ul class="plain">'+BIZ.map(function(q){return '<li><span>'+esc(q)+'</span></li>';}).join('')+'</ul></div>'+
  '<div class="stack"><h3>Clue phrases</h3><p class="note">When you hear one of these, stop and ask the follow-up. Tap a phrase to see what it means.</p><div>'+CLUES.map(function(c){return '<details><summary>'+esc(c[0])+'</summary><p><b>It usually means:</b> '+esc(c[1])+'</p><p><b>Ask next:</b> '+esc(c[2])+'</p></details>';}).join('')+'</div></div>'+
  '<div class="stack"><h3>Map the steps</h3><p class="note">List each step in order and who does it. The tool counts the handoffs.</p><div class="stack" id="l-steps">'+listHtml('steps','who','what','Who does it','What they do')+'</div><div class="row"><button type="button" class="ghost" data-addl="steps">Add a step</button><span id="handoffs">'+handoffs()+'</span></div><div id="map" class="scroll">'+mapSvg()+'</div><p class="note">The map draws itself from your list. Thicker arrows are handoffs between people.</p></div>'+
  '<div class="stack"><h3>Evidence log</h3><p class="note">Write down what people said, in their words, and every number you were given. You will cite these later.</p><div class="stack" id="l-notes">'+listHtml('notes','who','said','Who said it, or which document','What they said, or the number')+'</div><div><button type="button" class="ghost" data-addl="notes">Add evidence</button></div></div>';}

/* ---------- Step 2: Check ---------- */
function checkOut(){var ask=[],yes=[];checksNow().forEach(function(c){var v=S.checks[c.id];if(v==='u')ask.push(c);if(v==='y')yes.push(c);});var h='';
  if(ask.length)h+='<div class="stack"><h3>Questions to go and ask</h3><ul class="plain">'+ask.map(function(c){return '<li><span>'+esc(c.q)+'</span></li>';}).join('')+'</ul></div>';
  if(yes.length)h+='<div class="stack"><h3>Possible problems you found</h3><ul class="plain">'+yes.map(function(c){var added=S.problems.some(function(p){return p.from===c.id;});return '<li><span>'+esc(c.p)+'</span><button type="button" class="ghost" data-add="'+c.id+'"'+(added?' disabled':'')+'>'+(added?'On your problem list':'Add to problem list')+'</button></li>';}).join('')+'</ul></div>';
  if(!ask.length&&!yes.length)h='<p class="note">Answer the checks above. Your questions and possible problems will appear here.</p>';return h;}
function renderCheck(){
  return '<div class="stack"><h2>Scan six areas, not only the tool</h2><p>Most business problems that look like technology problems start somewhere else. Answer from what you have read and heard. "Don\'t know" is a useful answer: it becomes a question to ask.</p></div><div>'+
  checksNow().map(function(c,i,L){var v=S.checks[c.id]||'',hd=(i===0||L[i-1].area!==c.area)?'<h3 class="area">'+c.area+'</h3>'+(c.area==='Security baseline'?'<p class="note">A baseline scan only. The tag on each check is the NIST Cybersecurity Framework 2.0 function it belongs to. It does not replace a security assessment.</p>':''):'';
    return hd+'<div class="check"><div id="lab-'+c.id+'">'+esc(c.t)+(c.f?' <span class="tag">['+c.f+']</span>':'')+'</div><div class="seg" role="radiogroup" aria-labelledby="lab-'+c.id+'">'+[['y','Yes'],['n','No'],['u',"Don't know"]].map(function(o){var id='c-'+c.id+'-'+o[0];return '<input type="radio" name="c-'+c.id+'" id="'+id+'" value="'+o[0]+'" data-check="'+c.id+'"'+(v===o[0]?' checked':'')+'><label for="'+id+'">'+o[1]+'</label>';}).join('')+
    '</div><div class="ev"><input type="text" id="ev-'+c.id+'" data-ev="'+c.id+'" value="'+esc(S.ev[c.id]||'')+'" placeholder="How do you know? (document, or who said it)" aria-label="Evidence for: '+esc(c.t)+'"></div></div>';}).join('')+
  '</div><div id="check-out" class="stack">'+checkOut()+'</div>';}

/* ---------- Step 3: Dig ---------- */
function hintFor(p){return SOLUTION.test(p.text||'')?'<span class="hint">This sounds like a solution. Describe what goes wrong, or what the business cannot do, instead.</span>':'';}
function whyNote(p){if(!p.whys.length)return '<span class="hint">No "why" yet. Right now this is only a symptom.</span>';
  var miss=p.whys.filter(function(w){return (w.a||'').trim()&&!(w.e||'').trim();}).length;
  return miss?'<span class="hint">'+miss+' answer'+(miss>1?'s have':' has')+' no evidence. Go and ask, or say plainly that it is your guess.</span>':'<span class="ok">Every answer has evidence.</span>';}
function renderDig(){
  var h='<div class="stack"><h2>Trace each problem toward its causes</h2><p>What people complain about is the error message, not the bug. Keep asking "why does that happen?" This chain finds one line of cause. The Fix step then checks for others, because most problems have more than one.</p></div>';
  if(!S.problems.length)h+='<p class="note">No problems on your list yet. Add one below, or go back to Check and add the ones you found.</p>';

/* ---------- Step 5: Fix ---------- */
function chosen(){var p=prob(S.chosen);if(p)return p;var l=ranked();return l.length?l[0].p:null;}
function walk(p){var t=p.tree||{},trail=[],causes=[],cur=null;
  for(var i=0;i<TREE.length&&!cur;i++){var g=TREE[i],a=t[g.id];if(!a){cur=g;break;}trail.push([g.q,a]);
    if(a==='y'){var node=g.y;while(typeof node==='object'){var b=t[node.id];if(!b){cur=node;break;}trail.push([node.q,b]);node=node[b];}if(!cur)causes.push(node);}}
  return {trail:trail,causes:causes,cur:cur,done:!cur};}
function treeHtml(p){var w=walk(p),h='';
  if(w.trail.length)h+='<ol class="trail">'+w.trail.map(function(t){return '<li><span>'+esc(t[0])+'</span><b>'+(t[1]==='y'?'Yes':'No')+'</b></li>';}).join('')+'</ol>';
  if(w.cur)h+='<div class="box"><strong>'+esc(w.cur.q)+'</strong><div class="row"><button type="button" class="btn" data-tree="y" data-node="'+w.cur.id+'" data-tp="'+p.id+'">Yes</button><button type="button" class="btn" data-tree="n" data-node="'+w.cur.id+'" data-tp="'+p.id+'">No</button></div></div>';
  else if(w.causes.length)h+='<p class="ok">The tree found '+w.causes.length+' cause type'+(w.causes.length>1?'s':'')+': '+w.causes.map(function(k){return esc(RC[k][0]);}).join('; ')+'.</p>';
  else h+='<p class="hint">You answered no to every branch, so none of the 17 cause types fits. Go back to Dig and ask "why" once more, or pick the closest type yourself below.</p>';
  if(w.trail.length)h+='<div><button type="button" class="ghost" data-treereset="'+p.id+'">Start the tree over</button></div>';return h;}
function fixOut(p){var r=RC[p.rc],others=(p.causes||[]).filter(function(k){return k!==p.rc&&RC[k];});
  if(!r)return '<p class="note">Choose the primary cause to see what kind of fix matches it.</p>';
  var h='<div class="box"><span class="lab">Kind of fix that matches the primary cause</span><strong>'+esc(r[1])+'</strong><span>'+esc(r[2])+'</span>'+(STD[p.rc]?'<span class="note">Standard term for this cause. '+esc(STD[p.rc])+'</span>':'');
  if(others.length)h+='<span class="lab" style="margin-top:6px">Also contributing, so your fix should not ignore them</span>'+others.map(function(k){return '<span>'+esc(RC[k][0])+': '+esc(RC[k][1].charAt(0).toLowerCase()+RC[k][1].slice(1))+'.</span>';}).join('');
  return h+'</div>';}
function swapOut(p){return p.swap==='y'?'<span class="hint">Then part of the cause is in the people or the steps. Include that in your fix, or new technology will fail the same way.</span>':p.swap==='n'?'<span class="ok">Then technology is a fair fix for this cause.</span>':p.swap==='u'?'<span class="hint">Ask yourselves what people would still do the same way with a new tool.</span>':'';}

   p.opts.map(function(o,i){var at=function(k){return 'data-p="'+p.id+'" data-o="'+i+'" data-k="'+k+'"';},id=function(k){return 'o'+i+'-'+k+'-'+p.id;};
    return '<div class="prob"><span class="tag">OPTION '+(i+1)+'</span>'+T(id('name'),'What is it?',at('name'),o.name,'Describe it without a product name if you can')+SEL(id('type'),'What kind of change is it?',at('type'),pairs(OPTS),o.type,'Choose one')+

     (p.opts.length>2?'<div class="row" style="justify-content:flex-end"><button type="button" class="ghost danger" data-rmopt="'+p.id+'" data-i="'+i+'">Remove this option</button></div>':'')+'</div>';}).join('')+

  var pick=p.pickOpt==='none'?'Do nothing for now':(p.opts[+p.pickOpt]&&p.pickOpt!==''?(p.opts[+p.pickOpt].name||'Option '+(+p.pickOpt+1)):'(not chosen yet)');

function gaps(p){var g=[],whys=p.whys.filter(function(w){return (w.a||'').trim();}),s=size(p),named=p.opts.filter(function(o){return (o.name||'').trim();});
  if(!(S.goal||'').trim())g.push('State what the business is trying to achieve (Ask step). A fix cannot be judged without it.');
  if(!(p.text||'').trim())g.push('Write what goes wrong (Dig step).');
  if(SOLUTION.test(p.text||''))g.push('Your summary names a solution. Describe the problem only.');
  if(!(p.who||'').trim())g.push('Say who feels the problem (Dig step).');
  if(!whys.length)g.push('Ask "why" at least once. Right now you only have a symptom.');
  var miss=whys.filter(function(w){return !(w.e||'').trim();}).length;if(miss)g.push(miss+' "why" answer'+(miss>1?'s have':' has')+' no evidence. Get it, or say plainly that it is your guess.');
  if(!s.h&&!s.cash)g.push('Size the problem (Size step). You have no numbers yet.');
  if((p.confT||p.conf||'30')==='50'||(p.confM||p.conf||'30')==='50')g.push('Your numbers are a rough guess. Confirm at least one of them with the business.');
  if(!walk(p).done)g.push('Finish the cause tree (Fix step) so you do not miss a second cause.');
  if(!RC[p.rc])g.push('Choose the primary cause (Fix step).');
  if(named.length<2)g.push('Compare at least two real options against doing nothing (Fix step).');
  if(p.pickOpt===''||p.pickOpt==null)g.push('Choose the option you recommend (Fix step).');
  var o=p.pickOpt!==''&&p.pickOpt!=='none'?p.opts[+p.pickOpt]:null;
  if(o){var c=optCalc(p,o);
    if(!(p.whyOpt||'').trim())g.push('Say why you chose this option and not the others.');
    if(!comp()&&c.pay==null)g.push('Your recommended option does not pay back on cash. Make the case on capacity, risk or the business goal, and say so openly.');
    if(o.use==='resist')g.push('You expect people to resist your recommended option. Say what you will do about that.');
    if(o.grow==='no')g.push('Your recommended option would not fit if the work doubled. Say how long it buys.');
    if(!o.pct)g.push('Estimate what share of the problem your recommended option removes.');
    if((p.rc==='owner'||p.rc==='external')&&o.type&&o.type!==OPTS[0])g.push('Your primary cause is not a technology cause, but you recommend a technology change. Explain how it reaches the cause.');
    if(p.swap==='y'&&o.type&&o.type!==OPTS[0]&&!(p.adopt||'').trim())g.push('Your software test says people or steps must change too. Say who has to work differently.');}
  if(o&&!(o.trade||'').trim())g.push('State the main tradeoff of your recommended option.');
  if(comp()&&o&&(o.type===OPTS[0]||o.type===OPTS[1]))g.push('The challenge is titled "Spreadsheet Exit." If you recommend keeping the spreadsheet, be ready to defend that with evidence.');
  if(!(p.users||[]).some(function(u){return (u.role||'').trim();}))g.push('Name who uses your solution (Fix step).');
  var sts=(p.stories||[]).filter(function(x){return (x.want||'').trim();});
  if(sts.length<2)g.push('Write at least two user stories, each with a "done when" test (Fix step).');else if(sts.some(function(x){return !(x.done||'').trim();}))g.push('Every user story needs a "done when" test.');
  if(!HOW.some(function(k){return ((p.how||{})[k[0]]||'').trim();}))g.push('Say how it must work: access, audit trail, data checks (Fix step).');
  if(!(p.day||[]).some(function(x){return (x.when||'').trim();}))g.push('Add a before-and-after moment for one user (Fix step).');
  if(!(p.store||[]).some(function(x){return (x.thing||'').trim();}))g.push('List what the solution must store (Fix step).');
  if(!(p.screens||[]).some(function(x){return (x.name||'').trim();}))g.push('List the screens a user would see (Fix step).');
  if(!(S.sources||[]).some(function(x){return (x.src||'').trim();}))g.push('Log your AI use and sources, including this tool (Report step).');
  if(!(p.adopt||'').trim())g.push('Say who has to work differently and what they will need (Fix step).');
  if(!(p.measure||'').trim()||!(p.target||'').trim())g.push('Name how you will know it worked: a measure and a target (Fix step).');
  return g;}
function enc(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}

function spec(p){var L=[],o=(p.pickOpt!==''&&p.pickOpt!=='none'&&p.pickOpt!=null)?p.opts[+p.pickOpt]:null,s=size(p),f=function(a,k){return (a||[]).filter(function(x){return (x[k]||'').trim();});},t=function(v,d){return (v||'').trim()||d;};

  L.push('','## Data');var ds=f(p.store,'thing');if(ds.length)ds.forEach(function(x){L.push('- '+x.thing.trim()+': '+t(x.fields,'(details not listed)')+(t(x.rule,'')?'. Rule: '+x.rule.trim():''));});else L.push('- (not listed)');
  L.push('','## Screens');var sc=f(p.screens,'name');if(sc.length)sc.forEach(function(x){L.push('- '+x.name.trim()+' ('+t(x.who,'user not stated')+'): '+t(x.does,'(not described)'));});else L.push('- (not listed)');
  L.push('','## How it must work');var hw=HOW.filter(function(k){return ((p.how||{})[k[0]]||'').trim();});if(hw.length)hw.forEach(function(k){L.push('- '+k[1]+': '+p.how[k[0]].trim());});else L.push('- (not stated)');
  var st=f(S.steps,'who');if(st.length){L.push('','## Process today');st.forEach(function(x,i){L.push((i+1)+'. '+x.who.trim()+': '+t(x.what,'(step)'));});}
  var dy=f(p.day,'when');if(dy.length){L.push('','## Before and after');dy.forEach(function(x){L.push('- '+x.when.trim(),'  - Before: '+t(x.before,'(blank)'),'  - After: '+t(x.after,'(blank)'));});}
  L.push('','## Not in this version');var nn=f(p.stories,'want').filter(function(x){return x.pri==='Not now';});nn.forEach(function(x){L.push('- '+x.want.trim());});if(o&&t(o.trade,''))L.push('- Tradeoff accepted: '+o.trade.trim());if(!nn.length&&!(o&&t(o.trade,'')))L.push('- (nothing listed)');
  L.push('','## Open questions');var oq=[];p.whys.forEach(function(w){if((w.a||'').trim()&&!(w.e||'').trim())oq.push('Confirm: '+w.a.trim());});checksNow().forEach(function(c){if(S.checks[c.id]==='u')oq.push(c.q);});if(oq.length)oq.forEach(function(q){L.push('- '+q);});else L.push('- (none)');
  var ev=f(S.notes,'said');if(ev.length){L.push('','## Evidence');ev.forEach(function(n){L.push('- '+t(n.who,'Source not stated')+': '+n.said.trim());});}
  return L.join('\n');}
function outlineHtml(p){var s=size(p),o=(p.pickOpt!==''&&p.pickOpt!=='none'&&p.pickOpt!=null)?p.opts[+p.pickOpt]:null,st=S.steps.filter(function(x){return (x.who||'').trim();}),us=(p.users||[]).filter(function(u){return (u.role||'').trim();}),must=(p.stories||[]).filter(function(x){return (x.want||'').trim()&&x.pri==='Must';}),ev=S.notes.filter(function(n){return (n.said||'').trim();}).length,m='<span class="hint">Missing. </span>';
  var B=[['Situation',(S.process?esc(S.process)+'. ':m)+(S.goal?'The business wants to: '+esc(S.goal)+'. ':'')+(st.length>1?'Show the process map ('+st.length+' steps).':'')],
   ['What we found by digging',ev?ev+' piece'+(ev===1?'':'s')+' of evidence logged. Lead with the one that surprised you most.':m+'Log what people told you in the Ask step.'],
   ['The problem and its cause',(p.text?esc(p.text)+'. ':m)+(RC[p.rc]?'Primary cause: '+esc(RC[p.rc][0].charAt(0).toLowerCase()+RC[p.rc][0].slice(1))+'. ':'')+(s.h?'About '+num(s.h)+' hours lost a year.':'')],
   ['Our solution and who uses it',(o&&o.name?esc(o.name)+'. ':m)+(us.length?'Users: '+us.map(function(u){return esc(u.role.trim());}).join(', ')+'.':'')],
   ['What it must do and how it must work',must.length?must.length+' must-have user stor'+(must.length===1?'y':'ies')+'. Show them, then the day in the life.':m+'Write user stories in the Fix step.'],
   ['Tradeoffs and how we will know it worked',(o&&(o.trade||'').trim()?'We give up: '+esc(o.trade.trim())+'. ':m)+((p.measure||'').trim()?'Measure: '+esc(p.measure.trim())+'.':'')]];
